name: Test and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: care_clinic
          POSTGRES_PASSWORD: care_clinic
          POSTGRES_DB: care_clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Alembic migrations on test DB
        env:
          DATABASE_URL: postgresql+psycopg2://care_clinic:care_clinic@localhost:5432/care_clinic_test
          TEST_DATABASE_URL: postgresql+psycopg2://care_clinic:care_clinic@localhost:5432/care_clinic_test
        run: uv run alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg2://care_clinic:care_clinic@localhost:5432/care_clinic_test
          TEST_DATABASE_URL: postgresql+psycopg2://care_clinic:care_clinic@localhost:5432/care_clinic_test
        run: uv run pytest src/app/tests/ -v

      - name: Run Ruff
        run: uv run ruff check .

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/care-clinic-repo/care-clinic:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/care-clinic-repo/care-clinic:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy care-clinic \
            --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/care-clinic-repo/care-clinic:${{ github.sha }} \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated \
            --add-cloudsql-instances=${{ secrets.GCP_PROJECT_ID }}:us-central1:care-clinic-db \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="TEST_DATABASE_URL=${{ secrets.DATABASE_URL }}"